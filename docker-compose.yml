services:
  app:
    build:
      context: .
      network: host
      args:
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    container_name: novel-ai-writer
    ports:
      # 仅绑定宿主机回环地址:公网无法直连,必须经 Apache 反向代理访问
      - "127.0.0.1:${APP_PORT:-3002}:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DB_DIR=/app/data
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      # MCP 认证:生产必须非 none(token 或 oauth)
      - MCP_AUTH_MODE=${MCP_AUTH_MODE:-none}
      - MCP_STATIC_TOKEN=${MCP_STATIC_TOKEN:-}
      - MCP_PUBLIC_URL=${MCP_PUBLIC_URL:-http://localhost:3002}
      - MCP_OAUTH_PASSWORD=${MCP_OAUTH_PASSWORD:-}
      # ⚠️ 本文件仅用于 local(内网)部署;APP_MODE=public 必须改用 docker-compose.public.yml
      #   (host 网络 + 宿主回环监听;若误在本文件设 APP_MODE=public,容器将监听容器内
      #    127.0.0.1 导致端口映射不通、Apache 502,属显性故障而非静默降级)
      - APP_MODE=${APP_MODE:-local}
      - WEB_PUBLIC_URL=${WEB_PUBLIC_URL:-}
      - WEB_USERNAME=${WEB_USERNAME:-}
      - WEB_PASSWORD_HASH=${WEB_PASSWORD_HASH:-}
      - WEB_SESSION_TTL_HOURS=${WEB_SESSION_TTL_HOURS:-168}
      # local 模式不读取以下变量(内部服务地址由设置页配置);仅占位透传
      - FUNASR_BASE_URL=${FUNASR_BASE_URL:-}
      - COMFYUI_BASE_URL=${COMFYUI_BASE_URL:-}
      - CLIPROXY_BASE_URL=${CLIPROXY_BASE_URL:-}
      # 容器内保持默认监听 0.0.0.0(不设 HOST),由上方宿主 127.0.0.1 端口发布实现公网隔离
    volumes:
      - novel-ai-data:/app/data
      - novel-ai-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  novel-ai-data:
  novel-ai-logs:
