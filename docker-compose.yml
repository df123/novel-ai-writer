services:
  app:
    build:
      context: .
      network: host
      args:
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    container_name: novel-ai-writer
    ports:
      # 仅绑定宿主机回环地址:公网无法直连,必须经 Apache 反向代理访问
      - "127.0.0.1:${APP_PORT:-3002}:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DB_DIR=/app/data
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      # MCP 认证:生产必须非 none(token 或 oauth)
      - MCP_AUTH_MODE=${MCP_AUTH_MODE:-none}
      - MCP_STATIC_TOKEN=${MCP_STATIC_TOKEN:-}
      - MCP_PUBLIC_URL=${MCP_PUBLIC_URL:-http://localhost:3002}
      - MCP_OAUTH_PASSWORD=${MCP_OAUTH_PASSWORD:-}
      # 注意:容器内不要设置 HOST(保持默认 0.0.0.0),否则端口映射失效;
      # 公网隔离由上方 127.0.0.1 端口绑定实现
    volumes:
      - novel-ai-data:/app/data
      - novel-ai-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  novel-ai-data:
  novel-ai-logs:
